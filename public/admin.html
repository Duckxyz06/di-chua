<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>Chùa Online – Admin</title>
<style>body{margin:0;padding:24px;background:#120707;color:#f9e8c6;font:14px/1.5 "Segoe UI",Arial,sans-serif}h1{margin:0 0 4px}textarea{width:100%;height:60vh;background:#1f100c;color:#ffeab8;border:1px solid #6a4a28;border-radius:10px;padding:12px;font:12.5px/1.5 Consolas,monospace}
button{padding:10px 18px;border-radius:10px;border:1px solid #c79a50;background:linear-gradient(#f6d27e,#c58a1c);color:#2a1608;font-weight:800;cursor:pointer}small{color:#c4a574}#m{margin-left:12px;color:#8fe0a0}</style></head>
<body><h1>Admin đầy đủ</h1><small>Sửa <b>config.json</b>: nghi thức &amp; điểm công đức, bảng ánh xạ quà (<code>giftMap</code>: tên quà TikTok → nghi thức), quẻ xăm, tên giả lập. Lưu là áp dụng ngay.</small>
<p><textarea id="t" spellcheck="false"></textarea></p><button id="s">Lưu cấu hình</button><span id="m"></span><p><a href="control.html" style="color:#f6d27e">← Về bảng điều khiển</a></p>
<script>const t=document.getElementById('t'),m=document.getElementById('m');fetch('/api/config').then(r=>r.json()).then(c=>t.value=JSON.stringify(c,null,2));
document.getElementById('s').onclick=async()=>{try{const c=JSON.parse(t.value);const response=await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(c)});if(!response.ok)throw new Error((await response.json()).error);m.textContent='Đã lưu ✓'}catch(e){m.style.color='#ff8a7a';m.textContent='JSON sai: '+e.message}}</script></body></html>
